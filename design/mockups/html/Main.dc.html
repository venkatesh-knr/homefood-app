<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Week at a glance</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',sans-serif;background:#FFF8EE;color:#2B2622}
a{color:#A35C00}a:hover{color:#7A4400}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1280px; height: 1000px; box-sizing: border-box; padding: 44px 48px; background: #FFF8EE; color: #2B2622; display: flex; flex-direction: column; gap: 28px">

<header style="display: flex; justify-content: space-between; align-items: flex-end; gap: 24px">
<div style="display: flex; flex-direction: column; gap: 6px">
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px; color: #A35C00; letter-spacing: 0.02em">HomeFood</span>
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 40px; line-height: 1.1">This week's menu</h1>
<sc-if value="{{showTamil}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 18px; color: #6E6259">இந்த வார உணவு</span>
</sc-if>
<span style="font-size: 15px; color: #6E6259">Monday 28 Sep – Sunday 4 Oct 2026 · Published</span>
</div>
<div style="display: flex; gap: 10px">
<button type="button" style="height: 44px; padding: 0 18px; border-radius: 12px; border: none; background: #2B2622; color: #FFF8EE; font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12m0 0l-5-5m5 5l5-5M4 21h16"></path></svg>
Save as image</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #CDBFA8; background: #FFFFFF; color: #2B2622; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9V3h12v6M6 18H4v-7h16v7h-2M8 14h8v7H8z"></path></svg>
Print</button>
<button type="button" style="height: 44px; padding: 0 16px; border-radius: 12px; border: 1.5px solid #CDBFA8; background: #FFFFFF; color: #2B2622; font-size: 15px; font-weight: 500; display: flex; align-items: center; gap: 8px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><path d="M8.6 13.5l6.8 4M15.4 6.5l-6.8 4"></path></svg>
Share</button>
</div>
</header>

<div style="display: grid; grid-template-columns: 140px repeat(7, minmax(0, 1fr)); gap: 10px">
<div></div>
<sc-for list="{{days}}" as="d" hint-placeholder-count="7">
<div style="padding: 10px 6px; border-radius: 14px; background: {{d.hbg}}; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 2px; min-height: 84px">
<sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; padding: 3px 10px; border-radius: 999px; background: #E08A00; color: #2B2622; margin-bottom: 4px">Today</span>
</sc-if>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 17px">{{d.en}}</span>
<sc-if value="{{showTamil}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 12px; color: #6E6259">{{d.ta}}</span>
</sc-if>
<span style="font-size: 12px; color: #6E6259">{{d.date}}</span>
</div>
</sc-for>

<sc-for list="{{meals}}" as="m" hint-placeholder-count="4">
<div style="border-radius: 14px; background: {{m.band}}; color: {{m.ink}}; padding: 14px; display: flex; flex-direction: column; justify-content: center; gap: 4px; min-height: 150px; box-sizing: border-box">
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 16px">{{m.en}}</span>
<sc-if value="{{showTamil}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 12.5px">{{m.ta}}</span>
</sc-if>
</div>
<sc-for list="{{m.cells}}" as="c" hint-placeholder-count="7">
<button type="button" aria-label="{{c.label}}" style="all: unset; box-sizing: border-box; cursor: pointer; border-radius: 14px; background: {{c.bg}}; border: {{c.border}}; padding: 12px 8px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; gap: 5px; text-align: center; min-height: 150px; font-family: 'Noto Sans', sans-serif; color: #2B2622">
<sc-if value="{{c.home}}" hint-placeholder-val="{{ true }}">
<span style="width: 58px; height: 58px; border-radius: 50%; background: {{c.tone}}; color: {{c.iniInk}}; display: flex; align-items: center; justify-content: center; font-family: Poppins, sans-serif; font-weight: 600; font-size: 22px; box-shadow: 0 0 0 3px #FFFFFF, 0 0 0 4px #E6D8C0; flex-shrink: 0">{{c.ini}}</span>
<span style="font-size: 13.5px; font-weight: 600; line-height: 1.25">{{c.main}}</span>
<sc-if value="{{showTamil}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 11.5px; color: #6E6259; line-height: 1.3">{{c.ta}}</span>
</sc-if>
<span style="font-size: 11.5px; color: #6E6259; line-height: 1.3">{{c.sides}}</span>
</sc-if>
<sc-if value="{{c.out}}" hint-placeholder-val="{{ false }}">
<span style="width: 58px; height: 58px; border-radius: 50%; background: #FFFFFF; border: 1.5px dashed #B98A4A; color: #8A4B00; display: flex; align-items: center; justify-content: center; box-sizing: border-box; flex-shrink: 0">
<sc-if value="{{c.dine}}" hint-placeholder-val="{{ false }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"></path></svg>
</sc-if>
<sc-if value="{{c.order}}" hint-placeholder-val="{{ false }}">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 13H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg>
</sc-if>
</span>
<span style="font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #8A4B00">{{c.outLabel}}</span>
<span style="font-size: 13.5px; font-weight: 600; line-height: 1.25">{{c.main}}</span>
<sc-if value="{{showTamil}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 11.5px; color: #6E6259">{{c.ta}}</span>
</sc-if>
<span style="font-size: 11.5px; color: #6E6259">{{c.place}}</span>
</sc-if>
<sc-if value="{{c.none}}" hint-placeholder-val="{{ false }}">
<span style="margin: auto 0; font-size: 12.5px; color: #6E6259">No snacks planned</span>
</sc-if>
</button>
</sc-for>
</sc-for>
</div>

<footer style="display: flex; align-items: center; gap: 28px; font-size: 13.5px; color: #4A3F37; border-top: 1px solid #EADFCB; padding-top: 18px">
<span style="display: flex; align-items: center; gap: 8px"><span style="width: 18px; height: 18px; border-radius: 5px; background: #FFEFD6; border: 2px solid #E08A00; box-sizing: border-box"></span>Today</span>
<span style="display: flex; align-items: center; gap: 8px; color: #8A4B00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M5 3v5a2 2 0 0 0 4 0V3M7 11v10M17 3c-2 1.5-3 4-3 7h3v11"></path></svg><span style="color: #4A3F37">Dine-out</span></span>
<span style="display: flex; align-items: center; gap: 8px; color: #8A4B00"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8h12l-1 13H7L6 8z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="color: #4A3F37">Order-in</span></span>
<span style="margin-left: auto; color: #6E6259">Tap any dish to see its photo, recipe and nutrition</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTamil":{"editor":"boolean","default":true},"$preview":{"width":1280,"height":1000}}'>
class Component extends DCLogic {
  renderVals() {
    const showTamil = this.props.showTamil ?? true;
    const T = {rice:'#EFE3C8', gold:'#F3D27A', red:'#D9643A', green:'#A9C98F', brown:'#C08A5B', dark:'#6B4A3A', pale:'#F6EBDD'};
    const DARK = {red:true, brown:true, dark:true};
    const TODAY = 2;
    const DAYS = [
      ['Mon','திங்கள்','28 Sep'],['Tue','செவ்வாய்','29 Sep'],['Wed','புதன்','30 Sep'],['Thu','வியாழன்','1 Oct'],
      ['Fri','வெள்ளி','2 Oct'],['Sat','சனி','3 Oct'],['Sun','ஞாயிறு','4 Oct']
    ];
    const MEALS = [
      {en:'Breakfast', ta:'காலை உணவு', band:'#F2B705', ink:'#2B2622', cells:[
        ['Idli','இட்லி','+ sambar, coconut chutney','rice'],
        ['Poha','போஹா','+ masala chai','gold'],
        ['Pongal','பொங்கல்','+ sambar, chutney','gold'],
        ['Upma','உப்புமா','+ coconut chutney','rice'],
        ['Aloo paratha','ஆலு பராத்தா','+ curd, pickle','brown'],
        ['Pesarattu','பெசரட்டு','+ ginger chutney','green'],
        ['Pancakes','பான்கேக்','+ fruit','brown']]},
      {en:'Lunch', ta:'மதிய உணவு', band:'#2F7A3E', ink:'#FFFFFF', cells:[
        ['Sambar rice','சாம்பார் சாதம்','+ beans poriyal, appalam','gold'],
        ['Rajma chawal','ராஜ்மா சாவல்','+ raita','red'],
        ['Curd rice','தயிர் சாதம்','+ mango pickle','rice'],
        ['Dal tadka','தால் தட்கா','+ jeera rice, salad','gold'],
        ['Bisi bele bath','பிசிபேளாபாத்','+ appalam','red'],
        ['Paneer butter masala','பனீர் பட்டர் மசாலா','+ roti','red'],
        ['Idiyappam','இடியாப்பம்','+ veg stew','rice']]},
      {en:'Snacks', ta:'சிற்றுண்டி', band:'#E8742A', ink:'#2B2622', cells:[
        ['Sundal','சுண்டல்','+ filter coffee','green'],
        ['Medu vada','மெது வடை','+ coconut chutney','brown'],
        ['Bajji','பஜ்ஜி','+ tea','gold'],
        null,
        ['Samosa','சமோசா','+ tea','brown'],
        ['Crêpes','க்ரேப்ஸ்','+ fruit','pale'],
        ['Murukku','முறுக்கு','+ filter coffee','brown']]},
      {en:'Dinner', ta:'இரவு உணவு', band:'#3B4A9C', ink:'#FFFFFF', cells:[
        ['Chapati','சப்பாத்தி','+ veg kurma','brown'],
        ['Dosa','தோசை','+ tomato chutney','gold'],
        ['Chicken teriyaki','சிக்கன் தெரியாக்கி','+ rice, miso soup','dark'],
        ['Pasta aglio e olio','பாஸ்தா','+ garlic bread','gold'],
        {out:'order', main:'Biryani', ta:'பிரியாணி', place:'from [restaurant]'},
        {out:'dine', main:'Family dinner out', ta:'வெளியே உணவு', place:'[Restaurant name]'},
        ['Katsu curry','கட்சு கறி','+ pickles','brown']]}
    ];
    const mk = (c, di, meal) => {
      const today = di === TODAY;
      const base = {home:false, out:false, dine:false, order:false, none:false};
      if (!c) return {...base, none:true, label: meal + ': nothing planned',
        bg: today ? '#FFEFD6' : '#FFFFFF', border: today ? '2px solid #E08A00' : '1px solid #EADFCB'};
      if (!Array.isArray(c)) return {...base, out:true, dine:c.out === 'dine', order:c.out === 'order',
        outLabel: c.out === 'dine' ? 'Dine-out' : 'Order-in', main:c.main, ta:c.ta, place:c.place,
        label: meal + ': ' + (c.out === 'dine' ? 'dine-out' : 'order-in') + ', ' + c.main,
        bg: today ? '#FFEFD6' : '#FBF4E8', border: today ? '2px dashed #E08A00' : '1.5px dashed #C9B89C'};
      return {...base, home:true, main:c[0], ta:c[1], sides:c[2], tone:T[c[3]], ini:c[0].charAt(0),
        iniInk: DARK[c[3]] ? '#FFF8EE' : '#2B2622', label: meal + ': ' + c[0] + ' ' + c[2],
        bg: today ? '#FFEFD6' : '#FFFFFF', border: today ? '2px solid #E08A00' : '1px solid #EADFCB'};
    };
    const days = DAYS.map((d, i) => ({en:d[0], ta:d[1], date:d[2], today:i === TODAY, hbg: i === TODAY ? '#FFEFD6' : 'transparent'}));
    const meals = MEALS.map(m => ({en:m.en, ta:m.ta, band:m.band, ink:m.ink, cells: m.cells.map((c, i) => mk(c, i, m.en))}));
    return { showTamil, days, meals };
  }
}
</script>
</body>
</html>
