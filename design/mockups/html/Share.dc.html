<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saved week image</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',sans-serif;background:#FFF8EE;color:#2B2622}
a{color:#A35C00}a:hover{color:#7A4400}
</style>
</helmet>
<div style="width: 1080px; height: 1580px; box-sizing: border-box; padding: 60px 56px 44px; background: #FFF8EE; color: #2B2622; display: flex; flex-direction: column; gap: 30px">

<header style="display: flex; flex-direction: column; gap: 8px">
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 20px; color: #A35C00; letter-spacing: 0.02em">HomeFood</span>
<h1 style="margin: 0; font-family: Poppins, sans-serif; font-weight: 700; font-size: 58px; line-height: 1.05">Our menu this week</h1>
<sc-if value="{{showTamil}}" hint-placeholder-val="{{ true }}">
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 24px; color: #6E6259">இந்த வார உணவு</span>
</sc-if>
<span style="font-size: 20px; color: #6E6259">Monday 28 Sep – Sunday 4 Oct 2026</span>
</header>



<footer style="margin-top: auto; display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #EADFCB; padding-top: 18px; font-size: 15px; color: #6E6259">
<span>Planned together with <span style="font-family: Poppins, sans-serif; font-weight: 600; color: #A35C00">HomeFood</span></span>
<span>Dishes only · no names or health details</span>
</footer>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"showTamil":{"editor":"boolean","default":true},"$preview":{"width":1080,"height":1580}}'>
class Component extends DCLogic {
  renderVals() {
    const showTamil = this.props.showTamil ?? true;
    const T = {rice:'#EFE3C8', gold:'#F3D27A', red:'#D9643A', green:'#A9C98F', brown:'#C08A5B', dark:'#6B4A3A', pale:'#F6EBDD'};
    const DARK = {red:true, brown:true, dark:true};
    const DAYS = [
      ['Monday','திங்கள்','28 Sep'],['Tuesday','செவ்வாய்','29 Sep'],['Wednesday','புதன்','30 Sep'],['Thursday','வியாழன்','1 Oct'],
      ['Friday','வெள்ளி','2 Oct'],['Saturday','சனி','3 Oct'],['Sunday','ஞாயிறு','4 Oct']
    ];
    const MEALS = [
      {en:'Breakfast', ta:'காலை உணவு', band:'#F2B705', ink:'#2B2622', cells:[
        ['Idli','இட்லி','+ sambar, coconut chutney','rice'],['Poha','போஹா','+ masala chai','gold'],
        ['Pongal','பொங்கல்','+ sambar, chutney','gold'],['Upma','உப்புமா','+ coconut chutney','rice'],
        ['Aloo paratha','ஆலு பராத்தா','+ curd, pickle','brown'],['Pesarattu','பெசரட்டு','+ ginger chutney','green'],
        ['Pancakes','பான்கேக்','+ fruit','brown']]},
      {en:'Lunch', ta:'மதிய உணவு', band:'#2F7A3E', ink:'#FFFFFF', cells:[
        ['Sambar rice','சாம்பார் சாதம்','+ beans poriyal, appalam','gold'],['Rajma chawal','ராஜ்மா சாவல்','+ raita','red'],
        ['Curd rice','தயிர் சாதம்','+ mango pickle','rice'],['Dal tadka','தால் தட்கா','+ jeera rice, salad','gold'],
        ['Bisi bele bath','பிசிபேளாபாத்','+ appalam','red'],['Paneer butter masala','பனீர் பட்டர் மசாலா','+ roti','red'],
        ['Idiyappam','இடியாப்பம்','+ veg stew','rice']]},
      {en:'Snacks', ta:'சிற்றுண்டி', band:'#E8742A', ink:'#2B2622', cells:[
        ['Sundal','சுண்டல்','+ filter coffee','green'],['Medu vada','மெது வடை','+ coconut chutney','brown'],
        ['Bajji','பஜ்ஜி','+ tea','gold'],null,['Samosa','சமோசா','+ tea','brown'],
        ['Crêpes','க்ரேப்ஸ்','+ fruit','pale'],['Murukku','முறுக்கு','+ filter coffee','brown']]},
      {en:'Dinner', ta:'இரவு உணவு', band:'#3B4A9C', ink:'#FFFFFF', cells:[
        ['Chapati','சப்பாத்தி','+ veg kurma','brown'],['Dosa','தோசை','+ tomato chutney','gold'],
        ['Chicken teriyaki','சிக்கன் தெரியாக்கி','+ rice, miso soup','dark'],['Pasta aglio e olio','பாஸ்தா','+ garlic bread','gold'],
        {out:'order', main:'Biryani', ta:'பிரியாணி'},
        {out:'dine', main:'Dinner out', ta:'வெளியே உணவு'},
        ['Katsu curry','கட்சு கறி','+ pickles','brown']]}
    ];
    const mk = (c, band) => {
      const base = {home:false, out:false, dine:false, order:false, none:false, band};
      if (!c) return {...base, none:true, bg:'#FBF6EE', border:'1px solid #EADFCB'};
      if (!Array.isArray(c)) return {...base, out:true, dine:c.out === 'dine', order:c.out === 'order', outLabel: c.out === 'dine' ? 'Dine-out' : 'Order-in', main:c.main, ta:c.ta, bg:'#FBF4E8', border:'1.5px dashed #C9B89C'};
      return {...base, home:true, main:c[0], ta:c[1], sides:c[2], tone:T[c[3]], ini:c[0].charAt(0), iniInk: DARK[c[3]] ? '#FFF8EE' : '#2B2622', bg:'#FFFFFF', border:'1px solid #EADFCB'};
    };
    const heads = MEALS.map(m => ({en:m.en, ta:m.ta, band:m.band, ink:m.ink}));
    const rows = DAYS.map((d, i) => ({en:d[0], ta:d[1], date:d[2], cells: MEALS.map(m => mk(m.cells[i], m.band))}));
    return { showTamil, heads, rows };
  }
}
</script>
</body>
</html>
