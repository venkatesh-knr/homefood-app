<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',sans-serif;background:#FFF8EE;color:#2B2622}
a{color:#8A4B00}a:hover{color:#5E3300}
button,input{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1400px; box-sizing: border-box; background: #FFF8EE; color: #2B2622; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 6px 8px">
<a href="Planner.dc.html" aria-label="Back to Week" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2622; border-radius: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column; flex-grow: 1">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 22px">Shopping</span>
<span style="font-size: 12.5px; color: #6E6259">{{summary}}</span>
</div>
</div>

<div style="display: flex; gap: 8px; padding: 8px 16px 0">
<a href="ShopFromPlan.dc.html" style="flex-grow: 1; height: 48px; border-radius: 14px; background: #E08A00; color: #2B2622; font-size: 14px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"></rect><path d="M3 10h18M8 3v4M16 3v4"></path></svg>From this week's meals</a>
<button type="button" onClick="{{addRegulars}}" style="height: 48px; padding: 0 14px; border-radius: 14px; border: 1.5px solid #CDBFA8; background: #FFFFFF; color: #2B2622; font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 6px; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#8A4B00" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2-5.5-2.9-5.5 2.9 1-6.2L3 9.6l6.2-.9z"></path></svg>{{regularsText}}</button>
</div>

<div style="padding: 12px 16px 0; display: flex; flex-direction: column; gap: 8px">
<label for="additem" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Add an item</label>
<div style="display: flex; align-items: center; gap: 8px; height: 50px; padding: 0 6px 0 14px; border-radius: 14px; background: #FFFFFF; border: 1px solid #CDBFA8">
<input id="additem" type="text" value="{{draft}}" onChange="{{type}}" placeholder="Add an item · e.g. tomato 1 kg / தக்காளி" style="border: none; outline: none; background: transparent; font-size: 15px; color: #2B2622; flex-grow: 1; min-width: 0">
<button type="button" aria-label="Add item" onClick="{{add}}" style="width: 40px; height: 40px; border-radius: 10px; border: none; background: #2B2622; color: #FFF8EE; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 6px">
<span style="font-size: 12px; color: #6E6259; align-self: center">Common:</span>
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" onClick="{{c.pick}}" style="height: 32px; padding: 0 12px; border-radius: 999px; border: 1px solid #CDBFA8; background: #FFFFFF; color: #2B2622; font-size: 13px; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 14px; padding: 16px 16px 0">
<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section aria-label="{{g.name}}" style="display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; padding: 0 4px">
<span style="width: 10px; height: 10px; border-radius: 3px; background: {{g.color}}"></span>
<span style="font-family: Poppins, sans-serif; font-weight: 600; font-size: 15px">{{g.name}}</span>
<span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 12.5px; color: #6E6259">{{g.ta}}</span>
<span style="margin-left: auto; font-size: 12px; color: #6E6259">{{g.count}}</span>
</div>
<div style="background: #FFFFFF; border: 1px solid #EADFCB; border-radius: 16px; display: flex; flex-direction: column">
<sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
<button type="button" role="checkbox" aria-checked="false" onClick="{{it.tick}}" style="all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 8px 14px; border-top: {{it.divider}}">
<span style="width: 24px; height: 24px; border-radius: 7px; border: 2px solid #B9AA92; box-sizing: border-box; flex-shrink: 0"></span>
<span style="display: flex; flex-direction: column; gap: 1px; flex-grow: 1; min-width: 0">
<span style="font-size: 15px; font-weight: 500">{{it.name}} <span style="font-family: 'Noto Sans Tamil', sans-serif; font-size: 12.5px; font-weight: 400; color: #6E6259">{{it.ta}}</span></span>
<sc-if value="{{it.hasNote}}" hint-placeholder-val="{{ false }}">
<span style="font-size: 12px; color: #6E6259">{{it.note}}</span>
</sc-if>
</span>
<span style="font-size: 13.5px; font-weight: 600; color: #4A3F37; white-space: nowrap">{{it.qty}}</span>
</button>
</sc-for>
</div>
</section>
</sc-for>
</div>

<div style="margin: 16px 16px 0; background: #F4ECDF; border-radius: 16px; padding: 4px 14px">
<div style="display: flex; align-items: center; justify-content: space-between; min-height: 44px">
<span style="font-size: 14px; font-weight: 600; color: #4A3F37">Bought · {{boughtCount}}</span>
<span style="font-size: 12px; color: #6E6259">Clears after a day</span>
</div>
<sc-for list="{{bought}}" as="b" hint-placeholder-count="2">
<button type="button" role="checkbox" aria-checked="true" onClick="{{b.untick}}" style="all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 4px 0; border-top: 1px solid #E6D8C0">
<span style="width: 24px; height: 24px; border-radius: 7px; background: #2F7A3E; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5 9-10"></path></svg></span>
<span style="font-size: 14.5px; color: #6E6259; text-decoration: line-through; flex-grow: 1">{{b.name}}</span>
<span style="font-size: 12px; color: #6E6259">{{b.by}}</span>
</button>
</sc-for>
</div>

<div style="margin-top: auto; padding: 16px 16px 24px; border-top: 1px solid #EADFCB; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 14px; border: none; background: #2B2622; color: #FFF8EE; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"></path></svg>Share list on WhatsApp</button>
<span style="font-size: 12px; color: #6E6259; text-align: center">Sends items and amounts only · everyone in Our Home sees this list</span>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1400}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '', regularsAdded: false,
      items: [
        { id:'tom', g:'veg', name:'Tomato', ta:'தக்காளி', qty:'1 kg', note:'From plan · sambar, rasam, chutney' },
        { id:'oni', g:'veg', name:'Small onion', ta:'சின்ன வெங்காயம்', qty:'500 g', note:'From plan · sambar, kurma' },
        { id:'drm', g:'veg', name:'Drumstick', ta:'முருங்கைக்காய்', qty:'4', note:'From plan · Thursday sambar' },
        { id:'cor', g:'veg', name:'Coriander', ta:'கொத்தமல்லி', qty:'1 bunch', note:'' },
        { id:'ban', g:'veg', name:'Banana', ta:'வாழைப்பழம்', qty:'1 dozen', note:'Regular' },
        { id:'tdl', g:'gro', name:'Toor dal', ta:'துவரம் பருப்பு', qty:'500 g', note:'From plan · sambar' },
        { id:'irc', g:'gro', name:'Idli rice', ta:'இட்லி அரிசி', qty:'1 kg', note:'From plan · idli batter' },
        { id:'chk', g:'gro', name:'Chickpeas', ta:'கொண்டைக்கடலை', qty:'250 g', note:'From plan · chana masala' },
        { id:'mlk', g:'dai', name:'Milk', ta:'பால்', qty:'2 L', note:'Regular' },
        { id:'crd', g:'dai', name:'Curd', ta:'தயிர்', qty:'500 g', note:'' },
        { id:'egg', g:'dai', name:'Eggs', ta:'முட்டை', qty:'12', note:'Added by Kavi' },
        { id:'soap', g:'oth', name:'Dish soap', ta:'', qty:'1', note:'' }
      ],
      bought: [ { id:'cur', name:'Curry leaves', by:'Appa' }, { id:'gng', name:'Ginger 100 g', by:'Amma' } ]
    };
  }
  renderVals() {
    const s = this.state;
    const G = [
      ['veg','Vegetables & fruits','காய்கறி, பழங்கள்','#2F7A3E'],
      ['gro','Groceries','மளிகை','#E08A00'],
      ['dai','Dairy & eggs','பால், முட்டை','#3B4A9C'],
      ['oth','Other','மற்றவை','#6E6259']
    ];
    const tick = (it) => () => this.setState({
      items: this.state.items.filter(x => x.id !== it.id),
      bought: [{ id: it.id, name: it.name + (it.qty ? ' ' + it.qty : ''), by: 'You' }, ...this.state.bought]
    });
    const groups = G.map(([id, name, ta, color]) => {
      const items = s.items.filter(x => x.g === id).map((x, i) => ({
        ...x, hasNote: !!x.note, divider: i === 0 ? 'none' : '1px solid #F1E7D6', tick: tick(x)
      }));
      return { name, ta, color, items, count: items.length ? items.length + ' to buy' : 'nothing yet' };
    });
    const bought = s.bought.map(b => ({ ...b, untick: () => this.setState({
      bought: this.state.bought.filter(x => x.id !== b.id),
      items: [...this.state.items, { id: b.id, g: 'oth', name: b.name, ta: '', qty: '', note: '' }]
    }) }));
    const addNamed = (name, g) => this.setState({ draft: '', items: [...this.state.items, { id: 'n' + Date.now(), g, name, ta: '', qty: '', note: 'Added by you' }] });
    const chips = [['Onion','veg'],['Potato','veg'],['Lemon','veg'],['Bread','oth']].map(([label, g]) => ({ label, pick: () => addNamed(label, g) }));
    return {
      summary: s.items.length + ' to buy · ' + s.bought.length + ' bought',
      groups, bought, boughtCount: s.bought.length, chips, draft: s.draft,
      type: (e) => this.setState({ draft: e.target.value }),
      add: () => { const t = this.state.draft.trim(); if (t) addNamed(t, 'oth'); },
      regularsText: s.regularsAdded ? 'Added' : 'Regulars',
      addRegulars: () => { if (!this.state.regularsAdded) this.setState({ regularsAdded: true, items: [...this.state.items, { id:'brd', g:'oth', name:'Bread', ta:'ரொட்டி', qty:'1', note:'Regular' }] }); }
    };
  }
}
</script>
</body>
</html>
