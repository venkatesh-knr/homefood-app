<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cook's sheet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&amp;family=Noto+Sans:wght@400;500;600&amp;family=Noto+Sans+Tamil:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Noto Sans','Noto Sans Tamil',sans-serif;background:#FFF8EE;color:#2B2622}
a{color:#8A4B00}a:hover{color:#5E3300}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 1250px; box-sizing: border-box; background: #FFF8EE; color: #2B2622; display: flex; flex-direction: column">

<div style="display: flex; align-items: center; gap: 4px; padding: 12px 12px 6px 8px">
<a href="TodayPrep.dc.html" aria-label="Back" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #2B2622; border-radius: 12px">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
</a>
<div style="display: flex; flex-direction: column">
<span style="font-family: Poppins, sans-serif; font-weight: 700; font-size: 22px">Cook's sheet</span>
<span style="font-size: 12.5px; color: #6E6259">The day's cooking as one message, for Helper or anyone cooking</span>
</div>
</div>

<div role="radiogroup" aria-label="Day" style="display: flex; gap: 8px; padding: 10px 16px 0">
<sc-for list="{{days}}" as="d" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{d.checked}}" onClick="{{d.pick}}" style="height: 38px; padding: 0 14px; border-radius: 999px; border: {{d.border}}; background: {{d.bg}}; color: {{d.ink}}; font-size: 13.5px; font-weight: 600; cursor: pointer">{{d.label}}</button>
</sc-for>
</div>

<div style="margin: 12px 16px 0; background: #FFFFFF; border: 1px solid #EADFCB; border-radius: 16px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 52px; padding: 6px 14px">
<span style="font-size: 14.5px; font-weight: 500">Language</span>
<div role="radiogroup" aria-label="Language" style="display: flex; padding: 3px; border-radius: 12px; background: #F4ECDF">
<sc-for list="{{langs}}" as="l" hint-placeholder-count="2">
<button type="button" role="radio" aria-checked="{{l.checked}}" onClick="{{l.pick}}" style="height: 36px; padding: 0 14px; border-radius: 9px; border: none; background: {{l.bg}}; color: #2B2622; font-size: 13.5px; font-weight: 600; cursor: pointer">{{l.label}}</button>
</sc-for>
</div>
</div>
<button type="button" role="switch" aria-checked="{{namesChecked}}" onClick="{{toggleNames}}" style="all: unset; box-sizing: border-box; cursor: pointer; display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 56px; padding: 6px 14px; border-top: 1px solid #F1E7D6">
<span style="display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 14.5px; font-weight: 500">Name who has the allergy</span>
<span style="font-size: 12px; color: #6E6259">Off: "1 person: no soy"</span>
</span>
<span style="width: 48px; height: 28px; border-radius: 999px; background: {{trackBg}}; display: flex; align-items: center; padding: 3px; box-sizing: border-box; justify-content: {{knob}}; flex-shrink: 0"><span style="width: 22px; height: 22px; border-radius: 50%; background: #FFFFFF"></span></span>
</button>
</div>

<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #6E6259; padding: 18px 20px 8px">Preview</span>
<div lang="{{langCode}}" style="margin: 0 16px; background: #E7F1E8; border: 1px solid #C9DECB; border-radius: 4px 18px 18px 18px; padding: 14px 16px; font-size: 14.5px; line-height: 1.55; white-space: pre-line">{{sheet}}</div>
<span style="font-size: 12px; color: #6E6259; padding: 8px 20px 0">Dishes, numbers and cooks only. No photos, nutrition or other household details.</span>

<div style="margin-top: auto; padding: 16px 16px 24px; border-top: 1px solid #EADFCB; background: #FFFFFF; display: flex; flex-direction: column; gap: 8px">
<button type="button" style="height: 52px; border-radius: 14px; border: none; background: #2B2622; color: #FFF8EE; font-size: 15.5px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a8 8 0 0 1-12 7l-5 1 1-4a8 8 0 1 1 16-4z"></path></svg>Send on WhatsApp</button>
<div style="display: flex; gap: 8px">
<button type="button" style="flex-grow: 1; height: 46px; border-radius: 14px; border: 1.5px solid #CDBFA8; background: #FFFFFF; color: #2B2622; font-size: 14.5px; font-weight: 600; cursor: pointer">Copy text</button>
<button type="button" style="flex-grow: 1; height: 46px; border-radius: 14px; border: 1.5px solid #CDBFA8; background: #FFFFFF; color: #2B2622; font-size: 14.5px; font-weight: 600; cursor: pointer">Print</button>
</div>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1250}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { day: 'tomorrow', lang: 'ta', names: false };
  }
  renderVals() {
    const s = this.state;
    const EN = {
      tomorrow: ['HomeFood · Thursday 1 Oct', '', 'Breakfast (5): Idli + sambar, coconut chutney · Helper',
        'Lunch (5): Chana masala + jeera rice, raita · Helper + Amma', 'Snacks (4): Sundal + tea · Paati',
        'Dinner (5): Chicken curry + chapati · Appa', '', 'Note: {ALLERGY}', 'Tonight: grind idli batter, soak chickpeas, set curd'],
      today: ['HomeFood · Wednesday 30 Sep', '', 'Breakfast (5): Pongal + sambar, coconut chutney · Amma',
        'Lunch (5): Curd rice + mango pickle · Helper', 'Snacks (4): Bajji + tea · Paati',
        'Dinner (5): Chicken teriyaki + rice, miso soup · Appa + Amma', '', 'Note: {ALLERGY}']
    };
    const TA = {
      tomorrow: ['HomeFood · வியாழன், 1 அக்.', '', 'காலை உணவு (5 பேர்): இட்லி + சாம்பார், தேங்காய் சட்னி · உதவியாளர்',
        'மதிய உணவு (5 பேர்): சனா மசாலா + ஜீரா சாதம், ராய்தா · உதவியாளர் + அம்மா', 'சிற்றுண்டி (4 பேர்): சுண்டல் + டீ · பாட்டி',
        'இரவு உணவு (5 பேர்): சிக்கன் கறி + சப்பாத்தி · அப்பா', '', 'கவனிக்க: {ALLERGY}', 'இன்றிரவு: இட்லி மாவு அரைக்கவும், கொண்டைக்கடலை ஊற வைக்கவும், தயிர் உறை ஊற்றவும்'],
      today: ['HomeFood · புதன், 30 செப்.', '', 'காலை உணவு (5 பேர்): பொங்கல் + சாம்பார், தேங்காய் சட்னி · அம்மா',
        'மதிய உணவு (5 பேர்): தயிர் சாதம் + மாங்காய் ஊறுகாய் · உதவியாளர்', 'சிற்றுண்டி (4 பேர்): பஜ்ஜி + டீ · பாட்டி',
        'இரவு உணவு (5 பேர்): சிக்கன் தெரியாக்கி + சாதம், மிசோ சூப் · அப்பா + அம்மா', '', 'கவனிக்க: {ALLERGY}']
    };
    const allergy = s.lang === 'ta'
      ? (s.names ? 'பாட்டிக்கு சோயா கூடாது' : 'ஒருவருக்கு சோயா கூடாது')
      : (s.names ? 'no soy for Paati' : '1 person: no soy');
    const lines = (s.lang === 'ta' ? TA : EN)[s.day].map(l => l.replace('{ALLERGY}', allergy));
    const days = [['today','Today · Wed'],['tomorrow','Tomorrow · Thu']].map(([id, label]) => {
      const on = s.day === id;
      return { label, checked: on ? 'true' : 'false', pick: () => this.setState({ day: id }),
        bg: on ? '#2B2622' : '#FFFFFF', ink: on ? '#FFF8EE' : '#2B2622', border: on ? '1.5px solid #2B2622' : '1px solid #CDBFA8' };
    });
    const langs = [['en','English'],['ta','தமிழ்']].map(([id, label]) => {
      const on = s.lang === id;
      return { label, checked: on ? 'true' : 'false', pick: () => this.setState({ lang: id }), bg: on ? '#FFFFFF' : 'transparent' };
    });
    return { days, langs, sheet: lines.join('\n'), langCode: s.lang,
      namesChecked: s.names ? 'true' : 'false', toggleNames: () => this.setState({ names: !this.state.names }),
      trackBg: s.names ? '#2F7A3E' : '#B9AA92', knob: s.names ? 'flex-end' : 'flex-start' };
  }
}
</script>
</body>
</html>
