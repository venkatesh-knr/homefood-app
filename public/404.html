<!doctype html>
<!--
  GitHub Pages serves this for any path it doesn't recognize as a static file
  (e.g. a shared invite link like /homefood-app/join/<token>, opened directly
  rather than navigated to inside the app). Encode the real path into a query
  string and redirect to the app's root, where the script in index.html
  decodes it and hands it back to react-router.
  https://github.com/rafgraph/spa-github-pages
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>HomeFood</title>
    <script>
      var pathSegmentsToKeep = 1 // keep "/homefood-app"
      var l = window.location
      l.replace(
        l.protocol +
          '//' +
          l.hostname +
          (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') +
          '/?/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash,
      )
    </script>
  </head>
  <body></body>
</html>
